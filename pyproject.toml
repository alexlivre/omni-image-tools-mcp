[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-image-tools-mcp"
version = "0.5.0"
description = "MCP server with image tools (vision + processing) supporting multiple providers"
authors = [
    {name = "Alex Borisov"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
keywords = ["mcp", "vision", "computer-vision", "ai", "llm", "ollama", "openai", "openrouter"]

dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "httpx",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml",
    "ExifRead>=3.0.0",
    "pillow-heif>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-aiofiles>=23.0.0",
    "types-PyYAML>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/alexlivre/omni-image-tools-mcp"
"Bug Reports" = "https://github.com/alexlivre/omni-image-tools-mcp/issues"
Source = "https://github.com/alexlivre/omni-image-tools-mcp"

[project.scripts]
omni-image-tools = "src.server:main"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
